[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
hilt = "2.60.1"
hilt-lifecycle-viewmodel = "1.4.0"
hilt-work = "1.4.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
datastore = "1.2.1"
workmanager = "2.11.2"
health-connect = "1.1.0"
sentry = "8.57.0"
sentry-plugin = "6.22.0"
navigation = "2.10.1"
lifecycle = "2.11.0"
ksp = "2.3.12"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.5.0-alpha28" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Lifecycle
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hilt-lifecycle-viewmodel" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }

# DataStore
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Health Connect
health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "health-connect" }

# Sentry
sentry = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
sentry-timber = { group = "io.sentry", name = "sentry-android-timber", version.ref = "sentry" }

# Timber
timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }

# Core
core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.2.0" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.8.0" }

# AboutLibraries (core only, UI is custom)
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version = "11.6.3" }

# Material Motion
material-motion = { group = "io.github.fornewid", name = "material-motion-compose-core", version = "2.0.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version = "11.6.3" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry-plugin" }
